<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Create Course</title>
  <script type="module">
    // Firebase modular imports (v10+)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcgNR-FkdJWxuXarpjrHG6gLWuAWveLjU",
      authDomain: "elevate-a6256.firebaseapp.com",
      projectId: "elevate-a6256",
      storageBucket: "elevate-a6256.appspot.com",
      messagingSenderId: "683687842608",
      appId: "1:683687842608:web:d7b3703cf9d80ddb9f2ef5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.createCourse = async function () {
      const data = {
        isLive: document.getElementById("isLive").checked
      };

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const thumbnail = document.getElementById("thumbnail").value.trim();
      const rating = document.getElementById("rating").value.trim();
      const timestamp = document.getElementById("lastUpdatedTimestamp").value.trim();
      const topic = document.getElementById("topic").value.trim();
      const chapterCount = document.getElementById("chapterCount").value.trim();
      const isLiveCourse = document.getElementById("isLiveCourse").checked;

      if (title) data.title = title;
      if (description) data.description = description;
      if (thumbnail) data.thumbnail = thumbnail;
      if (rating) data.rating = parseFloat(rating);
      if (timestamp) data.lastUpdatedTimestamp = Number(timestamp);
      if (topic) data.topic = topic;
      if (chapterCount) data.chapterCount = Number(chapterCount);
      if (isLiveCourse) data.isLiveCourse = true;

      try {
        const docRef = await addDoc(collection(db, "Courses"), data);
        alert("🎉 Course created successfully!\nDocument ID: " + docRef.id);
      } catch (error) {
        console.error("❌ Error adding course:", error);
        alert("Failed to create course.");
      }
    }
  </script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      border-top: 6px solid #DD4F5A;
    }

    h2 {
      color: #37817B;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type="checkbox"] {
      margin-right: 8px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background-color: #DD4F5A;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c23f4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create New Course</h2>

    <label>Title</label>
    <input type="text" id="title">

    <label>Description</label>
    <input type="text" id="description">

    <label>Thumbnail URL</label>
    <input type="text" id="thumbnail">

    <label>Rating</label>
    <input type="number" id="rating">

    <label>Last Updated Timestamp</label>
    <input type="number" id="lastUpdatedTimestamp">

    <label>Topic</label>
    <input type="text" id="topic">

    <label>Chapter Count</label>
    <input type="number" id="chapterCount">

    <label><input type="checkbox" id="isLive" checked> Is Live</label>
    <label><input type="checkbox" id="isLiveCourse"> Is Live Course (Optional)</label>

    <button onclick="createCourse()">Create Course</button>
  </div>
</body>
</html>
